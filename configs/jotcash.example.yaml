# jotcash 配置样例
#
# 用法：复制本文件为同目录下的 jotcash.yaml 后按需修改。
#   cp configs/jotcash.example.yaml configs/jotcash.yaml
# jotcash.yaml 含令牌密钥，已被 .gitignore 忽略，不会提交进仓库。
#
# 配置文件路径的确定顺序：命令行参数 > 环境变量 jotcash_config > configs/jotcash.yaml
#
# 本文件**只装部署相关参数**，共 5 类。业务阈值（令牌有效期 12 小时、连续登录失败
# 5 次锁定 10 分钟、Argon2 密码哈希参数、汇率 8 位小数、本位币 2 位定点、密码长度
# 与字符类别要求）一律写死在代码里，不在此配置——它们是规则而非部署差异，
# 尤其是安全参数不应存在可被调低的入口。
#
# 本位币与界面语言是**用户级**设置，在系统内按账户配置，不在此文件。

# 监听地址。默认 :4747（不绑定具体网卡，容器与局域网均可访问）。
# 只允许本机访问时写 127.0.0.1:4747；IPv6 写 [::1]:4747。必须带端口。
listen_address: ":4747"

# SQLite 数据文件路径。默认 data/jotcash.db（相对二进制的工作目录）。
# 运行时同目录还会产生 -wal 与 -shm 两个副产品文件，备份时需一并考虑。
# 目录不存在时由程序在初始化数据库阶段创建。
sqlite_path: "data/jotcash.db"

# 登录令牌签名密钥。**必填**，且请务必改成自己的随机值。
# 留空会导致启动失败：令牌是无状态的，其不可伪造性完全依赖此密钥。
# 生成一个随机值：openssl rand -base64 48
# 注意：修改此值会使所有已签发的登录令牌立即失效，全部用户需重新登录。
token_secret: ""

# 汇率源服务端点与访问密钥。汇率源尚未选定，两项均可留空；
# 待选定后按该汇率源的要求填写（是否需要密钥、端点的具体形态由汇率源决定）。
fx_rate_endpoint: ""
fx_rate_secret: ""

# 日志级别，可选 panic / fatal / error / warn / info / debug / trace。默认 info。
# 注意：系统首次初始化时会把 admin 的初始密码打印到日志中一次，
# 请及时登录修改密码，并留意日志文件的存放与分享范围。
log_level: "info"
